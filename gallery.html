<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wanderlist — Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-surface text-neutral-900 antialiased selection:bg-accent selection:text-white">

  <div class="max-w-8xl mx-auto px-6 md:px-12">

    <!-- Navbar !copy and paste from index.html -->
    <nav class="flex items-center justify-between py-8">
      <a href="index.html" class="font-display font-bold text-2xl tracking-tight flex items-center gap-1">
        Wander<span class="text-accent">list</span>
      </a>

      <div class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="index.html" class="nav-link text-neutral-500 hover:text-neutral-900">Home</a>
        <a href="destinations.html" class="nav-link text-neutral-500 hover:text-neutral-900">Destinations</a>
        <a href="gallery.html" class="nav-link active">Gallery</a>
      </div>
    </nav>

    <!-- Page Header !copy and paste from destinations.html-->
    <header class="py-16 md:py-24 max-w-2xl">
      <h1 class="font-display font-extrabold text-5xl md:text-6xl tracking-tight text-neutral-950 mb-6">The Gallery</h1>
      <p class="text-neutral-600 text-lg leading-relaxed">A visual journal from the road. No filters, no staged
        setups—just raw moments captured across different time zones.</p>
    </header>

    <!-- Masonry Gallery -->
    <section class="pb-24 pt-8">

      <div class="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">

        <!-- Image 1 -->
        <div class="break-inside-avoid group overflow-hidden bg-neutral-200 zoom-wrapper">
          <img src="images/paris-gallery-1.jpg" alt="Eiffel Tower in Paris at sunset"
            class="w-full h-auto object-cover" />
        </div>

        <!-- Image 2 -->
        <div class="break-inside-avoid group overflow-hidden bg-neutral-200 zoom-wrapper">
          <img src="images/bali-gallery-1.jpg" alt="Tropical beach in Bali" class="w-full h-auto object-cover" />
        </div>

        <!-- Image 3 -->
        <div class="break-inside-avoid group overflow-hidden bg-neutral-200 zoom-wrapper">
          <img src="images/kyoto-gallery-1.jpg" alt="Traditional temple in Kyoto" class="w-full h-auto object-cover" />
        </div>

        <!-- Image 4 -->
        <div class="break-inside-avoid group overflow-hidden bg-neutral-200 zoom-wrapper">
          <img src="images/bali-gallery-2.jpg" alt="Rice terraces in Bali" class="w-full h-auto object-cover" />
        </div>

        <!-- Image 5 -->
        <div class="break-inside-avoid group overflow-hidden bg-neutral-200 zoom-wrapper">
          <img src="images/paris-gallery-2.jpg" alt="Street cafe in Paris" class="w-full h-auto object-cover" />
        </div>

        <!-- Image 6 -->
        <div class="break-inside-avoid group overflow-hidden bg-neutral-200 zoom-wrapper">
          <img src="images/kyoto-gallery-2.jpg" alt="Bamboo grove in Kyoto" class="w-full h-auto object-cover" />
        </div>

      </div>

    </section>

    <!-- Footer !copy and paste from index.html-->
    <footer
      class="py-12 border-t border-neutral-200 flex flex-col md:flex-row items-center justify-between text-xs text-neutral-500 gap-4">
      <p>&copy; 2026 Wanderlist Travel Guide.</p>
      <div class="flex gap-6">
        <a href="index.html" class="hover:text-neutral-900 transition-colors">Home</a>
        <a href="destinations.html" class="hover:text-neutral-900 transition-colors">Destinations</a>
      </div>
    </footer>

  </div>

</body>

</html>
